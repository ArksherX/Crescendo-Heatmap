[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crescendo-heatmap"
version = "0.1.0"
description = "Visualize adversarial safety decay in multi-turn conversations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ark Sher", email = "you@example.com" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
crescendo-heatmap = "crescendo_heatmap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
